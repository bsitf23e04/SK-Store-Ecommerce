<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neurofive Storefront</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- === Yahan se CSS Shuru Hai === -->
    <style>
        :root {
            --primary: #10b981;      /* Naya Pyara Sa Green Color */
            --primary-dark: #059669; /* Dark Green */
            --bg: #f8fafc;
            --text: #1e293b;
            --muted: #64748b;
            --white: #ffffff;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

        /* Buttons */
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: var(--radius); cursor: pointer; font-weight: 500; transition: all 0.3s ease; }
        .btn-primary { background: var(--primary); color: var(--white); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: var(--shadow); }
        .btn-secondary { background: var(--white); color: var(--text); border: 1px solid #cbd5e1; }
        .btn-secondary:hover { background: #f1f5f9; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        /* Navbar */
        .navbar { background: var(--white); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; }
        .logo { font-size: 1.5rem; font-weight: 700; text-decoration: none; color: var(--text); }
        .logo span { color: var(--primary); }
        .nav-actions { display: flex; gap: 1rem; align-items: center; }
        .search-input { padding: 0.6rem 1rem; border: 1px solid #cbd5e1; border-radius: var(--radius); min-width: 200px; }
        .cart-count { background: #ef4444; color: white; border-radius: 50%; padding: 0.1rem 0.5rem; font-size: 0.8rem; margin-left: 0.5rem; }

        /* Filters */
        .filter-container { padding: 2rem 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap; }
        .category-btn { padding: 0.5rem 1rem; background: transparent; border: 1px solid #cbd5e1; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .category-btn.active, .category-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* Product Grid & Card */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 2rem; padding-bottom: 3rem; }
        .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: transform 0.3s ease; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        .card-img { height: 200px; width: 100%; object-fit: contain; background: white; padding: 1rem; }
        .card-body { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem; height: 40px; overflow: hidden; }
        .card-price { font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-bottom: 1rem; }
        .card-actions { margin-top: auto; display: flex; gap: 0.5rem; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.3s; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: var(--radius); max-width: 600px; width: 90%; position: relative; display: flex; gap: 2rem; animation: slideUp 0.3s; }
        .btn-close { position: absolute; top: 1rem; right: 1rem; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted); }

        /* Toast */
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: white; padding: 1rem 2rem; border-radius: var(--radius); box-shadow: var(--shadow); transform: translateY(100px); opacity: 0; transition: all 0.4s ease; z-index: 2000; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Cart & Checkout Views */
        .cart-item, .checkout-item { display: flex; gap: 1rem; padding: 1rem 0; border-bottom: 1px solid #e2e8f0; align-items: center; }
        .cart-item img { width: 80px; height: 80px; object-fit: contain; }
        .qty-controls { display: flex; align-items: center; gap: 0.5rem; }
        .qty-btn { width: 30px; height: 30px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; }
        .cart-summary { margin-top: 2rem; text-align: right; }
        .empty-state { text-align: center; padding: 4rem; color: var(--muted); }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .fade-in { animation: fadeIn 0.5s ease; }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container { flex-direction: column; gap: 1rem; }
            .search-input { width: 100%; }
            .modal-content { flex-direction: column; padding: 1rem; }
        }
    </style>
    <!-- === CSS Khatam === -->

</head>
<body>
    <!-- Header / Nav -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="#/" class="logo">SK Store<span>.</span></a>
            <div class="nav-actions">
                <input type="text" id="searchInput" placeholder="Search products..." class="search-input">
                <button id="cartBtn" class="btn btn-primary">
                    Cart <span id="cartCount" class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Category Filter -->
    <div class="container filter-container">
        <div id="categoryFilters" class="categories"></div>
    </div>

    <!-- Main App View -->
    <main id="app" class="container"></main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Product Detail Modal -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeModal" class="btn-close">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- === Yahan se JavaScript Shuru Hai === -->
    <script>
        // State Management
        let products = [];
        let cart = JSON.parse(localStorage.getItem('n5-cart')) || [];
        let activeCategory = 'all';
        let categoriesList = []; // Filter bug fix ke liye

        // DOM Elements
        const app = document.getElementById('app');
        const toast = document.getElementById('toast');
        const modal = document.getElementById('modal');
        const modalBody = document.getElementById('modalBody');
        const cartCount = document.getElementById('cartCount');

        // API Call
        async function fetchProducts() {
            try {
                const res = await fetch('https://fakestoreapi.com/products');
                return await res.json();
            } catch (error) {
                app.innerHTML = `<div class="empty-state">Failed to load products. Please try again later.</div>`;
                return [];
            }
        }

        // UI Kit: Toast
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // UI Kit: Modal
        function openModal(productId) {
            const product = products.find(p => p.id === productId);
            modalBody.innerHTML = `
                <img src="${product.image}" class="card-img" style="width: 50%; object-fit: contain;">
                <div>
                    <h2>${product.title}</h2>
                    <p style="color: var(--muted); margin: 1rem 0;">${product.description}</p>
                    <h3 style="color: var(--primary); margin-bottom: 1rem;">$${product.price.toFixed(2)}</h3>
                    <button class="btn btn-primary" onclick="addToCart(${product.id}); closeModal();">Add to Cart</button>
                </div>
            `;
            modal.classList.add('active');
        }

        function closeModal() { modal.classList.remove('active'); }
        document.getElementById('closeModal').addEventListener('click', closeModal);

        // Cart Logic
        function addToCart(id) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ id, qty: 1 });
            }
            updateCart();
            showToast('Item added to cart!');
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
            renderApp();
        }

        function updateQty(id, delta) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) removeFromCart(id);
            }
            updateCart();
            renderApp();
        }

        function updateCart() {
            localStorage.setItem('n5-cart', JSON.stringify(cart));
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            cartCount.textContent = count;
        }

        function getCartTotal() {
            return cart.reduce((sum, item) => {
                const product = products.find(p => p.id === item.id);
                return sum + (product ? product.price * item.qty : 0);
            }, 0);
        }

        // Rendering & Routing
        function renderApp() {
            const hash = window.location.hash || '#/';
            
            if (hash.startsWith('#/product/')) {
                const id = parseInt(hash.split('/')[2]);
                openModal(id);
            } else if (hash === '#/cart') {
                renderCart();
            } else if (hash === '#/checkout') {
                renderCheckout();
            } else {
                renderHome();
            }
        }

        function renderHome() {
            closeModal();
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = products.filter(p => 
                (activeCategory === 'all' || p.category === activeCategory) &&
                (p.title.toLowerCase().includes(searchTerm) || p.description.toLowerCase().includes(searchTerm))
            );

            app.innerHTML = `
                <h2 class="fade-in" style="margin-bottom: 1.5rem;">Featured Products</h2>
                <div class="product-grid">
                    ${filtered.map(p => `
                        <div class="card fade-in">
                            <img src="${p.image}" class="card-img" alt="${p.title}">
                            <div class="card-body">
                                <h3 class="card-title">${p.title}</h3>
                                <p class="card-price">$${p.price.toFixed(2)}</p>
                                <div class="card-actions">
                                    <button class="btn btn-secondary" onclick="location.hash='#/product/${p.id}'">Details</button>
                                    <button class="btn btn-primary" onclick="addToCart(${p.id})">Add</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderCart() {
            closeModal();
            if (cart.length === 0) {
                app.innerHTML = `<div class="empty-state"><h2>Your cart is empty</h2><p>Browse our products and add some items!</p></div>`;
                return;
            }

            app.innerHTML = `
                <h2 class="fade-in" style="margin: 2rem 0;">Shopping Cart</h2>
                ${cart.map(item => {
                    const p = products.find(prod => prod.id === item.id);
                    return `
                        <div class="cart-item fade-in">
                            <img src="${p.image}" alt="${p.title}">
                            <div style="flex-grow: 1;">
                                <h4>${p.title}</h4>
                                <p style="color: var(--primary); font-weight: bold;">$${(p.price * item.qty).toFixed(2)}</p>
                                <div class="qty-controls">
                                    <button class="qty-btn" onclick="updateQty(${p.id}, -1)">-</button>
                                    <span>${item.qty}</span>
                                    <button class="qty-btn" onclick="updateQty(${p.id}, 1)">+</button>
                                    <button class="btn btn-danger" style="margin-left: 1rem; padding: 0.2rem 0.5rem;" onclick="removeFromCart(${p.id})">Remove</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
                <div class="cart-summary fade-in">
                    <h2>Total: $${getCartTotal().toFixed(2)}</h2>
                    <button class="btn btn-primary" style="margin-top: 1rem;" onclick="location.hash='#/checkout'">Proceed to Checkout</button>
                </div>
            `;
        }

        function renderCheckout() {
            closeModal();
            app.innerHTML = `
                <h2 class="fade-in" style="margin: 2rem 0;">Checkout Summary</h2>
                <div class="card fade-in" style="padding: 2rem;">
                    <h3>Order Details</h3>
                    ${cart.map(item => {
                        const p = products.find(prod => prod.id === item.id);
                        return `<div class="checkout-item"><span>${p.title} (x${item.qty})</span><span>$${(p.price * item.qty).toFixed(2)}</span></div>`;
                    }).join('')}
                    <div class="checkout-item" style="font-weight: bold; font-size: 1.2rem; border-bottom: none;">
                        <span>Grand Total</span><span>$${getCartTotal().toFixed(2)}</span>
                    </div>
                    <button class="btn btn-primary" style="width: 100%; margin-top: 2rem;" onclick="placeOrder()">Place Order</button>
                </div>
            `;
        }

        function placeOrder() {
            cart = [];
            updateCart();
            showToast('Order placed successfully!');
            location.hash = '#/';
        }

        // Event Listeners
        document.getElementById('cartBtn').addEventListener('click', () => location.hash = '#/cart');
        document.getElementById('searchInput').addEventListener('input', renderApp);
        window.addEventListener('hashchange', renderApp);

        // Init
        async function init() {
            updateCart();
            products = await fetchProducts();
            
            // Filter Bug Fix: Index use karne se apostrophe wali category break nahi hogi
            categoriesList = ['all', ...new Set(products.map(p => p.category))];
            document.getElementById('categoryFilters').innerHTML = categoriesList.map((cat, index) => `
                <button class="category-btn ${cat === 'all' ? 'active' : ''}" onclick="filterCategory(${index})">${cat.charAt(0).toUpperCase() + cat.slice(1)}</button>
            `).join('');
            
            renderApp();
        }

        // Filter function update
        function filterCategory(index) {
            activeCategory = categoriesList[index];
            document.querySelectorAll('.category-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            renderApp();
        }

        init();
    </script>
    <!-- === JavaScript Khatam === -->
</body>
</html>
